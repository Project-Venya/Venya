[workspace]
resolver = "2"

members = ["speech_to_text", "text_to_speech", "hot_dog", "python_runner"]

[workspace.package]
publish = false
edition = "2021"


[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
csv = "1.3.1"
derive = "1.0.0"
deunicode = "1.6.1"
features = "0.10.0"
# griffin-lim = { git = "http://github.com/emotechlab/griffin-lim.git" }
hound = "3.5.1"
ndarray = "0.16.1"
ndarray-npy = "0.9.1"                                         # Just for convenient moving to/from python for checking
num2words = "1.2.0"
once_cell = "1.21.3"
ort = { version = "2.0.0-rc.0", features = ["load-dynamic"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ssml-parser = "0.1.4"
#tch = "0.8.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
#tract-onnx = { version = "0.20.21" }
unicode-segmentation = "1.12.0"
dioxus = { version = "0.6.3", features = ["fullstack", "router"] }
reqwest = { version = "0.12.15", features = ["json"] }
cpal = { version = "0.15" }
vosk = "0.3.1"
libloading = "0.8"
ffmpeg-next = "7.1.0"
rubato = "0.16.2"
realfft = "3.4.0"
bytemuck = "1.22.0"
sherpa-rs = { version = "0.6.6", features = ["tts", "download-binaries"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
